
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>경제 지표 시계열 분석</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            background-color: #FFFFFF;
            color: #000000;
            line-height: 1.6;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        .main-content {
            display: grid;
            grid-template-columns: 300px 1fr;
            gap: 30px;
        }

        .filter-section {
            background-color: #F5F5F5;
            border: 1px solid #E0E0E0;
            border-radius: 12px;
            padding: 20px;
            position: sticky;
            top: 20px;
            display: flex;
            flex-direction: column;
            height: 265px;
        }

        .filter-title {
            color: #1a1a1a;
            font-size: 1.1em;
            font-weight: 600;
            margin-bottom: 15px;
            flex-shrink: 0;
        }

        .filter-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            flex: 1;
            overflow-y: auto;
            padding-right: 10px;
        }

        .filter-item {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }

        .filter-item input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: #32B8C6;
        }

        .filter-item label {
            cursor: pointer;
            color: #1a1a1a;
            font-size: 0.95em;
            user-select: none;
            flex: 1;
        }

        .filter-item input[type="checkbox"]:hover + label {
            color: #32B8C6;
            font-weight: 600;
        }

        .btn-reset {
            background-color: #FFFFFF;
            border: 1px solid #E0E0E0;
            border-radius: 6px;
            padding: 8px 12px;
            color: #1a1a1a;
            font-size: 0.9em;
            cursor: pointer;
            margin-top: 15px;
            width: 100%;
            transition: all 0.3s ease;
            flex-shrink: 0;
        }

        .btn-reset:hover {
            background-color: #F5F5F5;
            border-color: #32B8C6;
            color: #32B8C6;
        }

        .charts-section {
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        .comparison-chart-wrapper {
            background-color: #FFFFFF;
            border: 1px solid #E0E0E0;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            display: none;
            height: 265px;
        }

        .comparison-chart-wrapper.active {
            display: flex;
            flex-direction: column;
        }

        .comparison-title {
            color: #1a1a1a;
            font-size: 1.2em;
            margin-bottom: 15px;
            font-weight: 600;
            text-align: center;
            flex-shrink: 0;
        }

        .chart-container {
            position: relative;
            flex: 1;
            background-color: #FAFAFA;
            border-radius: 8px;
            padding: 10px;
        }

        .chart-section {
            background-color: #FFFFFF;
            border: 1px solid #E0E0E0;
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 25px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .chart-title {
            color: #1a1a1a;
            font-size: 1.2em;
            margin-bottom: 15px;
            font-weight: 600;
            text-align: center;
        }

        .chart-wrapper {
            position: relative;
            height: 175px;
            margin-bottom: 15px;
            background-color: #FAFAFA;
            border-radius: 8px;
            padding: 10px;
        }

        .chart-value {
            text-align: center;
            padding: 10px;
            background-color: #F5F5F5;
            border-radius: 6px;
            margin-top: 10px;
        }

        .chart-value-number {
            font-size: 1.4em;
            color: #1a1a1a;
            font-weight: bold;
        }

        .loading {
            text-align: center;
            padding: 50px;
            color: #666666;
        }

        .empty-message {
            text-align: center;
            padding: 40px;
            color: #999999;
            font-size: 1.1em;
        }

        @media (max-width: 1024px) {
            .main-content {
                grid-template-columns: 1fr;
            }

            .filter-section {
                position: static;
                height: auto;
            }

            .filter-list {
                flex-direction: row;
                flex-wrap: wrap;
                flex: none;
            }

            .comparison-chart-wrapper {
                height: auto;
            }

            .comparison-chart-wrapper.active {
                display: block;
            }
        }

        @media (max-width: 768px) {
            .chart-wrapper {
                height: 150px;
            }

            .chart-container {
                height: auto;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="main-content">
            <div class="filter-section">
                <div class="filter-title">📊 지표 선택</div>
                <div class="filter-list" id="filterList"></div>
                <button class="btn-reset" onclick="resetFilters()">초기화</button>
            </div>

            <div class="charts-section">
                <div class="comparison-chart-wrapper active" id="comparisonChart">
                    <div class="comparison-title">📈Economic Index</div>
                    <div class="chart-container">
                        <canvas id="mainChart"></canvas>
                    </div>
                </div>

                <div id="individualCharts"></div>
            </div>
        </div>
    </div>

    <script>
        const colors = [
            '#FF5459', '#E6815F', '#50B8C6', '#22C55E', '#F59E0B',
            '#8B5CF6', '#06B6D4', '#EC4899', '#14B8A6', '#F97316',
            '#A78BFA', '#34D399', '#FBBF24', '#F87171', '#60A5FA',
            '#FB923C', '#10B981', '#F472B6'
        ];

        let charts = {};
        let selectedIndicators = [];
        let allData = {};

        // CSV 데이터
        const csvData = `date,Non Farm Payrolls,Unemployment Rate,JOLTs Job Openings,Inflation Rate YoY,Core Inflation Rate YoY,Core PCE Price Index MoM,Retail Sales MoM,Personal Income MoM,Personal Spending MoM,Michigan Consumer Sentiment Prel,Fed Funds Rate,Existing Home Sales,GDP Growth Rate QoQ 2nd Est,Durable Goods Orders MoM,Core CPI,Retail Sales Ex Autos MoM,ISM Manufacturing PMI,Consumer Confidence

7/1/2025,159511,4.2,7208,322.132,328.656,126.424,628747,26200.2,20981.2,61.7,4.33,4010000,,303032,328.656,628747,,16.381
8/1/2025,159485,4.3,7227,323.364,329.793,126.703,632149,26303,21087.1,58.2,4.33,4000000,,312138,329.793,632149,,15.75
9/1/2025,159593,4.4,7658,324.368,330.542,126.954,632664,26397.5,21152.2,55.1,4.22,4050000,,313715,330.542,632664,,15.789
10/1/2025,159488,,7670,,,,633232,,,53.6,4.09,4110000,,,,633232,,18.087

12/1/2025,159552,4.6,0,325.031,331.068,0,0,0,0,51,3.88,4130000,0,0,331.068,0,0,19.77`;

        function parseCSV(csv) {
            const lines = csv.split('\n').filter(line => line.trim());
            const headers = lines[0].split(',').map(h => h.trim());
            const data = [];

            for (let i = 1; i < lines.length; i++) {
                const values = lines[i].split(',');
                const row = {};

                headers.forEach((header, j) => {
                    const value = values[j] ? values[j].trim() : '';

                    if (j === 0) {
                        row[header] = value;
                    } else {
                        if (value === '' || value === '0') {
                            row[header] = null;
                        } else {
                            const num = parseFloat(value);
                            row[header] = isNaN(num) ? null : num;
                        }
                    }
                });

                data.push(row);
            }

            return {
                headers: headers.slice(1),
                data: data
            };
        }

        // 표준화 함수 (z-score)
        function standardize(values) {
            const validValues = values.filter(v => v !== null && v !== undefined);
            if (validValues.length === 0) return values;

            const mean = validValues.reduce((a, b) => a + b) / validValues.length;
            const variance = validValues.reduce((a, b) => a + Math.pow(b - mean, 2), 0) / validValues.length;
            const stdDev = Math.sqrt(variance);

            if (stdDev === 0) return values.map(v => v !== null ? 0 : null);
            return values.map(v => v !== null ? (v - mean) / stdDev : null);
        }

        function formatNumber(num) {
            if (num === null || num === undefined) return 'N/A';
            return num.toLocaleString('ko-KR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        }

        function initFilters() {
            const { headers, data } = parseCSV(csvData);
            allData = { headers, data };

            const filterList = document.getElementById('filterList');
            filterList.innerHTML = '';

            headers.forEach((header, idx) => {
                const hasData = data.some(row => row[header] !== null && row[header] !== undefined);
                if (hasData) {
                    const div = document.createElement('div');
                    div.className = 'filter-item';
                    div.innerHTML = `
                        <input type="checkbox" id="filter-${idx}" onchange="updateCharts()">
                        <label for="filter-${idx}">${header}</label>
                    `;
                    filterList.appendChild(div);
                }
            });
        }

        function getSelectedIndicators() {
            const checkboxes = document.querySelectorAll('#filterList input[type="checkbox"]:checked');
            const indicators = [];
            checkboxes.forEach(cb => {
                const label = cb.nextElementSibling.textContent;
                indicators.push(label);
            });
            return indicators;
        }

        function createComparisonChart() {
            const selected = getSelectedIndicators();
            if (selected.length === 0) {
                document.getElementById('comparisonChart').classList.remove('active');
                return;
            }

            document.getElementById('comparisonChart').classList.add('active');

            const { data } = allData;
            const ctx = document.getElementById('mainChart');

            if (!ctx) return;

            const labels = data.map(item => {
                const dateStr = item.date;
                const month = parseInt(dateStr.split('/')[0]);
                return month + '월';
            });

            const datasets = selected.map((indicator, idx) => {
                const values = data.map(item => item[indicator]);
                const standardizedValues = standardize(values);
                const color = colors[idx % colors.length];
                const rgb = parseInt(color.slice(1, 3), 16) + ',' +
                           parseInt(color.slice(3, 5), 16) + ',' +
                           parseInt(color.slice(5, 7), 16);

                return {
                    label: indicator,
                    data: standardizedValues,
                    borderColor: color,
                    backgroundColor: `rgba(${rgb}, 0.1)`,
                    borderWidth: 2,
                    fill: false,
                    tension: 0.4,
                    pointRadius: 3,
                    pointBackgroundColor: color,
                    pointBorderColor: '#FFFFFF',
                    pointBorderWidth: 2,
                    pointHoverRadius: 5,
                    spanGaps: false
                };
            });

            if (charts['mainChart']) {
                charts['mainChart'].destroy();
            }

            charts['mainChart'] = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: datasets
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            display: true,
                            position: 'top'
                        },
                        tooltip: {
                            backgroundColor: 'rgba(255,255,255,0.95)',
                            padding: 12,
                            titleColor: '#000000',
                            bodyColor: '#000000',
                            borderColor: '#666666',
                            borderWidth: 1,
                            titleFont: { size: 14, weight: 'bold' },
                            bodyFont: { size: 13 },
                            callbacks: {
                                title: function(context) {
                                    if (context.length > 0) {
                                        const dataIndex = context[0].dataIndex;
                                        const dateStr = data[dataIndex].date;
                                        const parts = dateStr.split('/');
                                        const month = parts[0].padStart(2, '0');
                                        const year = parts[2];
                                        return year + '-' + month;
                                    }
                                    return '';
                                },
                                label: function(context) {
                                    const value = context.parsed.y;
                                    return context.dataset.label + ': ' + (value !== null ? value.toFixed(2) : 'N/A');
                                }
                            }
                        }
                    },
                    scales: {
                        x: {
                            grid: { color: 'rgba(0,0,0,0.05)', drawBorder: false },
                            ticks: { color: '#666666', font: { size: 11 } }
                        },
                        y: {
                            grid: { color: 'rgba(0,0,0,0.05)', drawBorder: false },
                            ticks: { color: '#666666', font: { size: 11 } },
                            title: {
                                display: true,
                                text: 'Normalized value'
                            }
                        }
                    }
                }
            });
        }

        function updateCharts() {
            createComparisonChart();
        }

        function resetFilters() {
            document.querySelectorAll('#filterList input[type="checkbox"]').forEach(cb => {
                cb.checked = false;
            });
            updateCharts();
        }

        document.addEventListener('DOMContentLoaded', () => {
            initFilters();
        });
    </script>
</body>
</html>
