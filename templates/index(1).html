<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Company Events Timeline</title>
    <!-- Tailwind CSS (CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">

    <!-- Header Section -->
    <header class="bg-white border-b border-gray-200 sticky top-0 z-10">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4">
            <div class="flex justify-between items-center">
                <div class="flex items-center gap-2">
                    <span class="text-2xl">📅</span>
                    <h1 class="text-xl font-bold text-gray-900">Company News</h1>
                </div>
                <div id="status-indicator" class="text-sm text-green-600 font-medium">
                    ● Live
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        
        <!-- Title & Description -->
        <div class="mb-8">
            <h2 class="text-3xl font-bold text-gray-900">2026년 이벤트 타임라인</h2>
            <p class="mt-2 text-gray-600">주요 기업들의 예정된 이벤트를 한눈에 확인하세요.</p>
        </div>

        <!-- Search & Filters -->
        <div class="bg-white p-4 rounded-lg shadow-sm border border-gray-200 mb-8">
            <div class="flex flex-col md:flex-row gap-4 justify-between items-center">
                
                <!-- Search Box -->
                <div class="relative w-full md:w-96">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <svg class="h-5 w-5 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                        </svg>
                    </div>
                    <input 
                        type="text" 
                        id="search-box" 
                        class="block w-full pl-10 pr-3 py-2 border border-gray-300 rounded-md leading-5 bg-white placeholder-gray-500 focus:outline-none focus:placeholder-gray-400 focus:ring-1 focus:ring-blue-500 focus:border-blue-500 sm:text-sm" 
                        placeholder="회사명 또는 티커 검색 (예: Apple, TSLA)"
                    >
                </div>

                <!-- Filter Buttons (UI Only) -->
                <div class="flex gap-2 overflow-x-auto pb-2 md:pb-0 w-full md:w-auto">
                    <button class="px-3 py-1.5 bg-gray-900 text-white text-sm font-medium rounded-full hover:bg-gray-800 transition">전체</button>
                    <button class="px-3 py-1.5 bg-gray-100 text-gray-700 text-sm font-medium rounded-full hover:bg-gray-200 transition">제품 출시</button>
                    <button class="px-3 py-1.5 bg-gray-100 text-gray-700 text-sm font-medium rounded-full hover:bg-gray-200 transition">규제/정책</button>
                    <button class="px-3 py-1.5 bg-gray-100 text-gray-700 text-sm font-medium rounded-full hover:bg-gray-200 transition">실적 발표</button>
                </div>
            </div>
        </div>

        <!-- Events Grid Container -->
        <div id="events-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <div class="col-span-full text-center py-12 text-gray-500">
                데이터를 불러오는 중...
            </div>
        </div>

    </main>

    <!-- JavaScript Logic -->
    <script>
        const searchInput = document.getElementById('search-box');
        const eventsContainer = document.getElementById('events-container');

        // Debounce 함수
        function debounce(func, timeout = 300) {
            let timer;
            return (...args) => {
                clearTimeout(timer);
                timer = setTimeout(() => { func.apply(this, args); }, timeout);
            };
        }

        // 데이터 가져오기 및 렌더링
        async function fetchAndRenderEvents(query = '') {
            try {
                const url = query 
                    ? `/api/events?company=${encodeURIComponent(query)}` 
                    : '/api/events';
                
                const response = await fetch(url);
                
                if (!response.ok) throw new Error('Network response was not ok');
                
                const events = await response.json();
                renderEvents(events);

            } catch (error) {
                console.error('Error fetching events:', error);
                eventsContainer.innerHTML = `
                    <div class="col-span-full text-center py-12 text-red-500 bg-red-50 rounded-lg border border-red-100">
                        <p class="font-bold">데이터를 불러오지 못했습니다.</p>
                        <p class="text-sm mt-1">${error.message}</p>
                    </div>
                `;
            }
        }

        // 카드 HTML 생성 및 주입
        function renderEvents(events) {
            eventsContainer.innerHTML = '';

            if (events.length === 0) {
                eventsContainer.innerHTML = `
                    <div class="col-span-full text-center py-12 text-gray-500 bg-gray-50 rounded-lg border border-dashed border-gray-300">
                        <p>검색 결과가 없습니다.</p>
                        <button onclick="document.getElementById('search-box').value=''; fetchAndRenderEvents();" class="mt-2 text-blue-600 hover:underline text-sm">
                            검색 초기화
                        </button>
                    </div>
                `;
                return;
            }

            events.forEach(event => {
                const dateDisplay = event.date === 'TBD' ? '미정' : event.date;
                
                let statusColor = 'bg-gray-100 text-gray-800';
                if(event.status === 'Completed') statusColor = 'bg-green-100 text-green-800';
                if(event.status === 'In Progress') statusColor = 'bg-blue-100 text-blue-800';

                const cardHTML = `
                    <div class="bg-white rounded-xl shadow-sm hover:shadow-md transition-shadow duration-200 border border-gray-100 overflow-hidden flex flex-col h-full">
                        <div class="p-5 flex-1">
                            <div class="flex justify-between items-start mb-4">
                                <div class="flex items-center gap-3">
                                    <div class="w-10 h-10 rounded-full bg-blue-50 flex items-center justify-center text-xl">
                                        ${event.icon}
                                    </div>
                                    <div>
                                        <h3 class="font-bold text-gray-900 leading-tight">${event.company}</h3>
                                        <p class="text-xs text-gray-500 mt-0.5">${event.companyName}</p>
                                    </div>
                                </div>
                                <span class="px-2.5 py-1 rounded-md text-xs font-medium ${statusColor}">
                                    ${event.status}
                                </span>
                            </div>
                            
                            <h4 class="text-lg font-semibold text-gray-800 mb-2 line-clamp-2">${event.title}</h4>
                            <p class="text-sm text-gray-600 line-clamp-3 mb-4">${event.description || '상세 설명이 없습니다.'}</p>
                        </div>
                        
                        <div class="bg-gray-50 px-5 py-3 border-t border-gray-100 flex justify-between items-center text-sm">
                            <span class="text-gray-500 flex items-center gap-1">
                                📅 ${dateDisplay}
                            </span>
                            <span class="text-blue-600 font-medium text-xs bg-blue-50 px-2 py-1 rounded uppercase tracking-wide">
                                ${event.category}
                            </span>
                        </div>
                    </div>
                `;
                eventsContainer.insertAdjacentHTML('beforeend', cardHTML);
            });
        }

        // 초기화 및 리스너 등록
        if (searchInput) {
            searchInput.addEventListener('input', debounce((e) => {
                const query = e.target.value.trim();
                fetchAndRenderEvents(query);
            }, 300));
        }

        document.addEventListener('DOMContentLoaded', () => {
            fetchAndRenderEvents();
        });
    </script>
</body>
</html>
