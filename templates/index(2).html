<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Company Event Timeline</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Company News</h1>
            <p style="color: 666; font-size: 14px; margin-bottom: 15px;">2026년 이벤트 타임라인</p>
        </div>

        <div class="search-box">
            <input type="text" id="searchInput" class="search-input" placeholder="Ticker(ex. JOBY, COIN)">
            <button class="search-clear" id="searchClear">검색 초기화</button>
        </div>

        <div class="filters">
            <button class="filter-btn active" data-filter="all">전체</button>
            <button class="filter-btn" data-filter="product-launch">제품 출시</button>
            <button class="filter-btn" data-filter="legislation">규제/정책</button>
            <button class="filter-btn" data-filter="earnings">실적 발표</button>
            <button class="filter-btn" data-filter="mna">인수/합병</button>
            <button class="filter-btn" data-filter="other">기타</button>
        </div>

        <div class="timeline">
            <div class="months-grid" id="monthsGrid">
                <!-- Months will be generated by JavaScript -->
            </div>
            <div id="noResultsMessage" class="no-results" style="display: none;">검색 결과가 없습니다.</div>
        </div>

        <!-- Tooltip Container -->
        <div id="tooltipContainer"></div>
    </div>

    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
